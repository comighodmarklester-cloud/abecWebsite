# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - abecwebapp

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.x'

      - name: Restore and audit all dependencies
        run: dotnet restore scripts/BatchVerification/BatchVerification.csproj -p:ContinuousIntegrationBuild=true

      - name: Build security verification tools
        run: dotnet build scripts/BatchVerification/BatchVerification.csproj --no-restore -c Release -p:ContinuousIntegrationBuild=true -p:UseAppHost=false -o artifacts/security-ci

      - name: Run security and frontend regression checks
        run: |
          dotnet artifacts/security-ci/BatchVerification.dll --code-security-only
          dotnet artifacts/security-ci/BatchVerification.dll --public-url-only
          node scripts/check-reports-layout.cjs
          node scripts/BatchVerification/check-registration-flow.cjs

      # Project owner holds .NET/EF/MySQL versions (2026-11-13).
      # Dependency vulnerability auditing above remains enforced.

      - name: dotnet publish
        run: dotnet publish 'ABEC System.csproj' --no-restore -c Release -p:ContinuousIntegrationBuild=true -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AC667E378FE74E26AABC07A6982BF272 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_43DDAC86F77D4A9891A25D4DB9CA2F95 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_970B9E68ACB64CD095B05D954DD04E5A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 'abecwebapp'
          slot-name: 'Production'
          package: .

