<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Documents - ABEC Student</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="../../wwwroot/css/abec-ui.css?v=20261107batchsdd1" rel="stylesheet"/>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
        },
        colors: {
          'abec-navy': '#0B1F3A',
          'abec-sidebar-active': 'rgba(255,255,255,0.08)',
          'abec-blue': '#2563EB',
          'surface': '#F5F9FF',
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', Inter, sans-serif; }
  .custom-scrollbar::-webkit-scrollbar { width: 4px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 10px; }
  body.doc-page .doc-page-header { margin-bottom: 0.65rem; }
  body.doc-page .doc-layout > section { padding: 0.85rem; }
  body.doc-page .doc-layout > section > .mb-5 { margin-bottom: 0.65rem; }
  body.doc-page #doc-release-info { margin-bottom: 0.65rem; padding: 0.55rem 0.75rem; font-size: 0.75rem; }
  body.doc-page #credentials-grid { gap: 0.65rem; }
  body.doc-page #credentials-grid > div { padding: 0.75rem; }
  body.doc-page #credentials-grid .w-12 { width: 2rem; height: 2rem; }
  body.doc-page #credentials-grid .mt-3 { margin-top: 0.5rem; }
  body.doc-page .doc-layout > section + section { padding: 0; margin-top: 0.65rem; }
  body.doc-page .doc-layout > section + section > div:first-child { padding: 0.65rem 0.85rem; }
  body.doc-page #recent-requests-body td,
  body.doc-page .doc-layout th { padding: 0.55rem 0.85rem; font-size: 0.75rem; }
  body.doc-page.student-dialog-open { overflow: hidden; }
  @media (min-width: 900px) {
    body.doc-page .request-dialog-card { max-width: 54rem; }
    body.doc-page #new-request-form { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1rem; padding: 1rem 1.25rem; }
    body.doc-page #new-request-form > * { margin: 0; }
    body.doc-page #new-request-form > .space-y-4 { grid-column: 2; grid-row: 1 / 3; }
    body.doc-page #new-request-form > button { grid-column: 1 / -1; }
  }
  @media (max-width: 639px) {
    body.doc-page .doc-layout table { min-width: 0; }
    body.doc-page .doc-layout thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    body.doc-page #recent-requests-body, body.doc-page #recent-requests-body tr { display: block; }
    body.doc-page #recent-requests-body td { display: flex; justify-content: space-between; gap: 1rem; }
    body.doc-page #recent-requests-body td[data-label]::before { content: attr(data-label); font-weight: 700; flex-shrink: 0; }
  }
  @media (min-width: 1100px) {
    body.doc-page #credentials-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
<link href="../../wwwroot/css/abec-responsive.css?v=20261114interface1" rel="stylesheet"/>
<link rel="stylesheet" href="../../wwwroot/css/abec-student-refinements.css?v=20261114updates1">
</head>
<body class="abec-app student-module student-desk doc-page bg-surface font-sans text-slate-800">

<div class="student-frame">

<main class="abec-main student-content">
  <header class="doc-page-header flex flex-wrap items-center justify-between gap-3 mb-4">
    <h2 class="text-2xl font-bold text-abec-navy">Documents</h2>

  </header>

  <div class="doc-layout space-y-4">
    <!-- ABEC-provided documents (requestable) -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div id="doc-release-info" class="mb-4 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Loading release information...</div>

      <div class="mb-5 flex flex-wrap gap-2" id="status-legend" aria-label="Document status legend">
        <span class="inline-flex items-center rounded-full bg-slate-100 text-slate-600 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">Not Prepared</span>
        <span class="inline-flex items-center rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">Ready for Release</span>
        <span class="inline-flex items-center rounded-full bg-amber-100 text-amber-700 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">Pending</span>
        <span class="inline-flex items-center rounded-full bg-sky-100 text-sky-700 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">Processing</span>
        <span class="inline-flex items-center rounded-full bg-orange-100 text-orange-700 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">On Hold</span>
        <span class="inline-flex items-center rounded-full bg-violet-100 text-violet-700 text-[10px] font-bold uppercase tracking-wide px-2.5 py-1">Released</span>
      </div>

      <div id="credentials-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="rounded-xl border border-slate-200 px-4 py-8 text-center text-sm text-slate-500 md:col-span-3">Loading credentials...</div>
      </div>
    </section>

    <!-- Request History -->
    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="px-6 py-5 border-b border-slate-100">
        <h3 class="text-lg font-bold text-abec-navy">Request History</h3>
        <p class="text-xs text-slate-500 mt-1">Your submitted document requests and their current statuses.</p>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left min-w-[720px]">
          <thead class="bg-slate-50/80 border-b border-slate-100">
            <tr class="text-sm font-bold text-abec-navy">
              <th class="px-6 py-4">Document Type</th>
              <th class="px-6 py-4">Date Requested</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Purpose</th>
            </tr>
          </thead>
          <tbody id="recent-requests-body" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="4" class="px-6 py-10 text-center text-sm text-slate-500">No document requests yet.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>
</main>

</div>

<script src="../../wwwroot/js/abec-api.js?v=20261112features1"></script>
<script src="../../wwwroot/js/abec-other-reason.js"></script>
<script src="../../wwwroot/js/abec-student-shell.js?v=20261114interface1"></script>
<script src="../../wwwroot/js/abec-student.js?v=20261114interface1"></script>
<script src="../../wwwroot/js/abec-student-documents.js?v=20261114interface1"></script>
</body>
</html>
